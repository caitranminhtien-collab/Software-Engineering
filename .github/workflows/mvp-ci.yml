name: Hue Tourism MVP CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript compile
        run: npm run build
      - name: Frontend syntax
        run: node --check frontend/app.js
      - name: MVP static integration contracts
        run: node --test tests/M28_mvp_contract.test.cjs
# CI verifies build/static contracts. Database, Redis, GPS field, and Staff flows
# require separate staging tests and are NOT marked as passed by this workflow.
