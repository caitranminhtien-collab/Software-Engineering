
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Static Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check frontend files
        run: |
          test -f index.html
          test -f admin.html
          test -f app.js
          test -f admin-auth.js
          test -f hue-admin-crud.js
          test -f hue-map.js
          test -f hue-chat-api.js
          test -f dev-server.js

      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check admin-auth.js
          node --check hue-admin-crud.js
          node --check hue-map.js
          node --check hue-chat-api.js
          node --check dev-server.js
