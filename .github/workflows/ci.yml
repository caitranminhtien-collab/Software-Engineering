name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hue_app
          POSTGRES_PASSWORD: hue_test_only
          POSTGRES_DB: hue_tourism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hue_app -d hue_tourism_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: hue_tourism_test
      DB_USER: hue_app
      DB_PASSWORD: hue_test_only
      DB_SSL: "false"
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: be03-test-session-secret-not-for-production
      EMBEDDING_PROVIDER: dev
      CHAT_PROVIDER: extractive
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      TEST_DB_PORT: "5432"
      TEST_DB_PASSWORD: hue_test_only
      TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Initialize empty test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail

          table_count=$(docker exec "$POSTGRES_CONTAINER" \
            psql -X -U hue_app -d hue_tourism_test -tAc \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")

          if [ "$table_count" != "0" ]; then
            echo "Expected an empty test database" >&2
            exit 1
          fi

          migrations=(
            "src/database/migrations/001_core_schema.sql"
            "M25_01_create_attraction_localization_revisions.sql"
            "M26_02_create_visitor_events.sql"
            "src/database/migrations/20261026_visitor_presence_last_seen.sql"
            "src/database/migrations/007_add_performance_indexes.sql"
            "src/database/migrations/008_allow_relative_media_url.sql"
          )

          for migration in "${migrations[@]}"; do
            echo "Applying: $migration"
            docker exec -i "$POSTGRES_CONTAINER" \
              psql -X -U hue_app -d hue_tourism_test \
              -v ON_ERROR_STOP=1 -f - < "$migration"
          done

      - name: Run backend tests
        run: npm test

      - name: Run PostgreSQL and Redis regressions
        run: node tests/run-real-services.cjs

  frontend:
    name: Frontend Static Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check frontend files
        run: |
          test -f index.html
          test -f admin.html
          test -f app.js
          test -f admin-auth.js
          test -f hue-admin-crud.js
          test -f hue-map.js
          test -f hue-chat-api.js
          test -f dev-server.js

      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check admin-auth.js
          node --check hue-admin-crud.js
          node --check hue-map.js
          node --check hue-chat-api.js
          node --check dev-server.js
