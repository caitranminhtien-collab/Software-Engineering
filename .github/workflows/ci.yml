name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/app_test
      TRANSLATOR_PROVIDER: mock
      TTS_PROVIDER: mock
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # trùng với Dockerfile và máy dev
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov
      # Cần tự thêm script "migration:run" vào package.json (xem README)
      - run: npm run migration:run
      - run: npm run test:e2e
      - run: npm run build
      - run: docker build -t app:${{ github.sha }} .
      - run: npm audit --audit-level=high
