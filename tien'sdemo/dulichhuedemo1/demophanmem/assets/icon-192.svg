<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A1C26"/>
      <stop offset="100%" stop-color="#090A0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Outer Decorative Ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="96" cy="96" r="68" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Pagoda / Ngo Mon Gate Stylized Crest -->
  <path d="M96 32 L118 52 L74 52 Z" fill="url(#goldGrad)"/>
  <!-- Top curved tier -->
  <path d="M54 62 C70 54 122 54 138 62 L132 70 C118 64 74 64 60 70 Z" fill="url(#goldGrad)"/>
  <!-- Middle tier -->
  <path d="M42 82 C64 72 128 72 150 82 L144 92 C124 84 68 84 48 92 Z" fill="url(#goldGrad)"/>
  
  <!-- Central Columns & Imperial Arch -->
  <rect x="62" y="92" width="12" height="46" fill="url(#goldGrad)"/>
  <rect x="118" y="92" width="12" height="46" fill="url(#goldGrad)"/>
  <rect x="88" y="92" width="16" height="46" fill="url(#redGrad)"/>
  <path d="M80 138 C80 118 112 118 112 138 Z" fill="#090A0E"/>

  <!-- Base Platform -->
  <rect x="36" y="138" width="120" height="12" rx="4" fill="url(#goldGrad)"/>
  <rect x="28" y="150" width="136" height="8" rx="3" fill="url(#redGrad)"/>

  <!-- Audio Waves Indicator -->
  <circle cx="96" cy="116" r="4" fill="#FDE68A"/>
  <path d="M86 116 C86 110 106 110 106 116" fill="none" stroke="#FDE68A" stroke-width="2"/>
  <path d="M80 116 C80 104 112 104 112 116" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.7"/>
</svg>
