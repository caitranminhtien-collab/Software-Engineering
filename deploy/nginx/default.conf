map $http_x_forwarded_proto $hue_forwarded_proto {
    default $scheme;
    https https;
}
map $http_cf_connecting_ip $hue_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cho phép multipart có thêm phần metadata.
    # Backend vẫn kiểm tra giới hạn từng file.
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $hue_client_ip;
    proxy_set_header X-Forwarded-For $hue_client_ip;
    proxy_set_header X-Forwarded-Proto $hue_forwarded_proto;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;

    location ^~ /api/v1/ {
        proxy_pass http://backend:3000;
        proxy_cache off;
    }

    location ^~ /uploads/media/ {
        proxy_pass http://backend:3000;
        proxy_cache off;
    }

    location /uploads/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}